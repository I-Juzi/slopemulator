[package]
name = "sts"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rand = "0.8"
sha2 = "0.10"
md-5 = "0.10"
rsa = "0.9"
num-bigint = "0.4"
num-traits = "0.2"
base64 = "0.22"
quick-xml = "0.38"
shared = { path = "../../Server/Shared", optional = true }
packet-ids = { path = "../../Server/PacketIds" }

[features]
default = []
np-adapter = ["dep:shared"]
listener = []

[[bin]]
name = "sts-local"
path = "src/bin/sts-local.rs"
required-features = ["listener"]
