[package]
name = "bnsdata"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reader and writer for Blade & Soul binary data files (LMXBOSLB, TADBOSLB). Keys come only from the operator at run time."

[dependencies]
aes = "0.8"
flate2 = "1"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = "0.8"
